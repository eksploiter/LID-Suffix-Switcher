<!doctype html>
<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    LID Suffix Switcher
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        var(
          --figma-color-bg,
          #2c2c2c
        );

      color:
        var(
          --figma-color-text,
          #ffffff
        );
    }


    .wrap {
      padding: 20px;
    }


    h1 {
      margin:
        0
        0
        6px;

      font-size: 18px;
    }


    .desc {
      margin-bottom: 18px;

      font-size: 12px;

      line-height: 1.55;

      color:
        var(
          --figma-color-text-secondary,
          #b3b3b3
        );
    }


    .card {
      padding: 14px;

      border:
        1px solid
        var(
          --figma-color-border,
          #4a4a4a
        );

      border-radius: 10px;

      margin-bottom: 14px;
    }


    .card-title {
      margin-bottom: 10px;

      font-size: 12px;

      font-weight: 700;
    }


    .suffix-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap: 8px;
    }


    .suffix-btn {
      height: 42px;

      border:
        1px solid
        #555555;

      border-radius: 8px;

      background:
        transparent;

      color:
        inherit;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }


    .suffix-btn:hover {
      border-color:
        #0d99ff;
    }


    .suffix-btn.selected {
      border-color:
        #0d99ff;

      background:
        rgba(
          13,
          153,
          255,
          0.15
        );

      color:
        #5eb8ff;
    }


    .options {
      margin:
        14px
        0;

      font-size: 11px;
    }


    label {
      display: flex;

      align-items: center;

      gap: 8px;
    }


    .run {
      width: 100%;

      height: 40px;

      border: 0;

      border-radius: 8px;

      background:
        #0d99ff;

      color:
        white;

      font-weight: 700;

      cursor: pointer;
    }


    .run:disabled {
      opacity: 0.4;

      cursor:
        not-allowed;
    }


    .status {
      display: none;

      margin-top: 12px;

      padding: 10px;

      border-radius: 8px;

      font-size: 11px;

      line-height: 1.5;
    }


    .status.show {
      display: block;
    }


    .status.success {
      background:
        rgba(
          40,
          180,
          99,
          0.14
        );

      color:
        #5ad98b;
    }


    .status.warning {
      background:
        rgba(
          240,
          173,
          78,
          0.15
        );

      color:
        #ffc66b;
    }


    .status.error {
      background:
        rgba(
          220,
          53,
          69,
          0.15
        );

      color:
        #ff7b8a;
    }


    .detail {
      margin-top: 8px;

      white-space:
        pre-wrap;
    }


    .hint {
      margin-top: 12px;

      font-size: 10px;

      line-height: 1.5;

      color:
        var(
          --figma-color-text-tertiary,
          #999999
        );
    }

  </style>

</head>


<body>

  <div class="wrap">

    <h1>
      LID Suffix Switcher
    </h1>


    <div class="desc">

      선택한 Frame / Component / Layer 안의
      LID 서픽스를 일괄 변경합니다.

      <br><br>

      화면에 표시되는 실제 텍스트는
      변경되지 않습니다.

    </div>


    <div class="card">

      <div class="card-title">
        변경할 서픽스
      </div>


      <div class="suffix-grid">

        <button
          class="suffix-btn"
          data-suffix="h"
        >
          _h
        </button>


        <button
          class="suffix-btn"
          data-suffix="k"
        >
          _k
        </button>


        <button
          class="suffix-btn"
          data-suffix="g"
        >
          _g
        </button>

      </div>

    </div>


    <div class="options">

      <label>

        <input
          id="excludeHidden"
          type="checkbox"
        />

        숨겨진 텍스트 레이어 제외

      </label>

    </div>


    <button
      id="runBtn"
      class="run"
      disabled
    >

      서픽스 일괄 변경

    </button>


    <div
      id="status"
      class="status"
    >

      <div
        id="statusMessage"
      >
      </div>


      <div
        id="detail"
        class="detail"
      >
      </div>

    </div>


    <div class="hint">

      `_h`, `_k`, `_g`로 끝나는
      텍스트 레이어 이름만 변경합니다.

      <br>

      예:
      `cci_msg_service_completed_k`
      → `cci_msg_service_completed_h`

    </div>

  </div>


  <script>

    let selectedSuffix =
      null;


    const suffixButtons =
      document.querySelectorAll(
        ".suffix-btn"
      );


    const runBtn =
      document.getElementById(
        "runBtn"
      );


    const status =
      document.getElementById(
        "status"
      );


    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    const detail =
      document.getElementById(
        "detail"
      );


    /**
     * suffix 선택
     */
    suffixButtons.forEach(
      (button) => {

        button.onclick =
          () => {

            selectedSuffix =
              button.dataset.suffix;


            /**
             * 기존 선택 해제
             */
            suffixButtons.forEach(
              (item) => {

                item
                  .classList
                  .remove(
                    "selected"
                  );

              }
            );


            /**
             * 현재 선택 표시
             */
            button
              .classList
              .add(
                "selected"
              );


            runBtn.disabled =
              false;

          };

      }
    );


    /**
     * 실행
     */
    runBtn.onclick =
      () => {

        if (!selectedSuffix) {
          return;
        }


        parent.postMessage(
          {

            pluginMessage: {

              type:
                "replace-suffix",

              targetSuffix:
                selectedSuffix,

              excludeHidden:
                document
                  .getElementById(
                    "excludeHidden"
                  )
                  .checked

            }

          },

          "*"
        );

      };


    /**
     * 결과 표시
     */
    onmessage =
      (event) => {

        const msg =
          event.data.pluginMessage;


        if (
          !msg ||
          msg.type !== "result"
        ) {

          return;

        }


        status.className =
          `status show ${msg.status}`;


        statusMessage.textContent =
          msg.message || "";


        if (!msg.counts) {

          detail.textContent =
            "";

          return;

        }


        const c =
          msg.counts;


        let text =

          `전체 Text Layer: ${c.total}개\n` +

          `변경: ${c.changed}개\n` +

          `이미 동일: ${c.alreadySame}개\n` +

          `지원 서픽스 없음: ${c.noSuffix}개`;


        if (c.hidden) {

          text +=
            `\n숨김 제외: ${c.hidden}개`;

        }


        if (c.failed) {

          text +=
            `\n실패: ${c.failed}개`;

        }


        /**
         * 변경 예시
         */
        if (
          msg.examples &&
          msg.examples.length
        ) {

          text +=

            `\n\n변경 예시:\n- ` +

            msg.examples.join(
              "\n- "
            );

        }


        detail.textContent =
          text;

      };

  </script>

</body>

</html>
